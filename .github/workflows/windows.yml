# Genera los instaladores .exe de Windows en GitHub (pestaña Actions → Instaladores Windows → Run workflow).
name: Instaladores Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        app: [game, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
        working-directory: ${{ matrix.app }}
      - run: npx tauri build
        working-directory: ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.app }}
          path: ${{ matrix.app }}/src-tauri/target/release/bundle/nsis/*.exe
