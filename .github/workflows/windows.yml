# Genera los instaladores .exe de Windows en GitHub (pestaña Actions → Instaladores Windows → Run workflow).
# Si escribes una versión (ej. v1.0.1) al correrlo, también la publica en Releases con los instaladores y el servidor.
name: Instaladores Windows
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión para publicar en Releases (ej. v1.0.1). Vacío = solo generar los instaladores.'
        required: false
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        app: [game, holdem, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
        working-directory: ${{ matrix.app }}
      # La app lleva el número de la versión que se publica; así sabe cuándo hay una más nueva.
      - name: Poner la versión
        if: inputs.version != '' || startsWith(github.ref, 'refs/tags/v')
        working-directory: ${{ matrix.app }}
        shell: bash
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version=process.env.VERSION.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(c,null,2))"
      # Con la clave del secreto TAURI_SIGNING_PRIVATE_KEY cada instalador sale firmado (.sig) para actualizarse solo.
      - name: Generar instalador
        working-directory: ${{ matrix.app }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else echo "::warning::Falta el secreto TAURI_SIGNING_PRIVATE_KEY: los instaladores salen sin firma y no se podrán actualizar solos."; npx tauri build; fi
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ matrix.app }}
          path: |
            ${{ matrix.app }}/src-tauri/target/release/bundle/nsis/*.exe
            ${{ matrix.app }}/src-tauri/target/release/bundle/nsis/*.exe.sig

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - run: zip -r instaladores/servidor-21-blackjack.zip server -x 'server/*.db*'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: 21 Blackjack ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: instaladores/*
          body_path: RELEASE.md
